# API + web only. Use an existing PostgreSQL — set DATABASE_URL in `.env`.
# RUN_DB_SEED defaults to false so redeploys do not reset site content (seed upserts overwrite rows).
# Empty DB first time: set RUN_DB_SEED=true in `.env`, `docker compose up` once, then set false again.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your PostgreSQL connection string}
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      COOKIE_NAME: ${COOKIE_NAME:-twentynine_admin_token}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      MAX_HOMESTAY_VIDEO_UPLOAD_MB: ${MAX_HOMESTAY_VIDEO_UPLOAD_MB:-100}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@twentyninehomestay.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      RUN_DB_PUSH: ${RUN_DB_PUSH:-true}
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
    ports:
      - "${API_PORT_FORWARD:-4001}:4000"
    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_ENABLE_MOCK_API: false
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
